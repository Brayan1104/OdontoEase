<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
    <h:head>
        <title>Facelet Title</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
              rel="stylesheet"/>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <h:outputStylesheet name="css/jsfcrud.css"/>
        <h:outputStylesheet library="css" name="style.css"/>
    </h:head>
    <h:body>
        <main class="home-container mt-3">

            <div class="container">
                <div class="row align-items-center" style="min-height: 400px;">

                    <!-- IMAGEN -->
                    <div class="col-md-6 text-center">
                        <h:graphicImage library="img"
                                        name="heroimg.png"
                                        style="height:350px;" />
                    </div>

                    <!-- TEXTO -->
                    <div class="col-md-6 text-center">

                        <h1 class="text-primary-emphasis text-black">
                            Bienvenido a OdontoEase
                        </h1>

                        <p class="text-secondary-emphasis text-black fs-3">
                            ¿Qué deseas hacer hoy?
                        </p>

                    </div>

                </div>
                <!-- MENU -->
                <div class="row mt-5">
                    <section>
                        <nav class="navbar justify-content-center navbar-expand-lg bg-body-tertiary">
                            <ul class="nav justify-content-center">
                                <li class="nav-item">
                                    <h:link class="nav-link active fs-4"
                                            outcome="/view/cita/List"
                                            value="Citas"/>
                                </li>
                                <li class="nav-item">
                                    <h:link class="nav-link fs-4"
                                            outcome="/view/paciente/List"
                                            value="Pacientes"/>
                                </li>
                                <li class="nav-item">
                                    <h:link class="nav-link fs-4"
                                            outcome="/view/pago/List"
                                            value="Pagos"/>
                                </li>
                            </ul>
                        </nav>
                    </section>
                </div>

            </div>

        </main>

    </h:body>




</html>
