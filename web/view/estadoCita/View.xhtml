<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewEstadoCitaTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewEstadoCitaLabel_idEstado}"/>
                    <h:outputText value="#{estadoCitaController.selected.idEstado}" title="#{bundle.ViewEstadoCitaTitle_idEstado}"/>
                    <h:outputText value="#{bundle.ViewEstadoCitaLabel_nombre}"/>
                    <h:outputText value="#{estadoCitaController.selected.nombre}" title="#{bundle.ViewEstadoCitaTitle_nombre}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{estadoCitaController.destroyAndView}" value="#{bundle.ViewEstadoCitaDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewEstadoCitaEditLink}"/>
                <br />
                <h:commandLink action="#{estadoCitaController.prepareCreate}" value="#{bundle.ViewEstadoCitaCreateLink}" />
                <br />
                <h:commandLink action="#{estadoCitaController.prepareList}" value="#{bundle.ViewEstadoCitaShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewEstadoCitaIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>
