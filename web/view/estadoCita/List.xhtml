<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListEstadoCitaTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <h:outputText escape="false" value="#{bundle.ListEstadoCitaEmpty}" rendered="#{estadoCitaController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{estadoCitaController.items.rowCount > 0}">
                    <h:outputText value="#{estadoCitaController.pagination.pageFirstItem + 1}..#{estadoCitaController.pagination.pageLastItem + 1}/#{estadoCitaController.pagination.itemsCount}"/>&nbsp;
                    <h:commandLink action="#{estadoCitaController.previous}" value="#{bundle.Previous} #{estadoCitaController.pagination.pageSize}" rendered="#{estadoCitaController.pagination.hasPreviousPage}"/>&nbsp;
                    <h:commandLink action="#{estadoCitaController.next}" value="#{bundle.Next} #{estadoCitaController.pagination.pageSize}" rendered="#{estadoCitaController.pagination.hasNextPage}"/>&nbsp;
                    <h:dataTable value="#{estadoCitaController.items}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListEstadoCitaTitle_idEstado}"/>
                            </f:facet>
                            <h:outputText value="#{item.idEstado}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListEstadoCitaTitle_nombre}"/>
                            </f:facet>
                            <h:outputText value="#{item.nombre}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&nbsp;"/>
                            </f:facet>
                            <h:commandLink action="#{estadoCitaController.prepareView}" value="#{bundle.ListEstadoCitaViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{estadoCitaController.prepareEdit}" value="#{bundle.ListEstadoCitaEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{estadoCitaController.destroy}" value="#{bundle.ListEstadoCitaDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
                <br />
                <h:commandLink action="#{estadoCitaController.prepareCreate}" value="#{bundle.ListEstadoCitaCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListEstadoCitaIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
