<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    
    <ui:composition template="/template.xhtml">

        <div  class="row text-center mt-10">
            <ui:define name="title">
                <h:outputText value="Lista de Pacientes"/>
            </ui:define>
        </div>

        <ui:define name="body">

            <div class="container mt-5">

                <div class="card shadow">

                    <h:form>

                        <!-- HEADER -->
                        <div class="card-header bg-primary text-white d-flex justify-content-between">
                            <h4>Pacientes</h4>

                            <h:commandLink action="#{pacienteController.prepareCreate}"
                                           styleClass="btn btn-light btn-sm"
                                           value="Nuevo Paciente"/>
                        </div>

                        <div class="card-body">

                            <!-- MENSAJES -->
                            <h:messages styleClass="alert alert-info"/>

                            <!-- TABLA -->
                            <div class="table-responsive">

                                <h:dataTable value="#{pacienteController.items}" var="item"
                                             styleClass="table table-striped table-hover">

                                    <h:column>
                                        <f:facet name="header">ID</f:facet>
                                            #{item.idPaciente}
                                    </h:column>

                                    <h:column>
                                        <f:facet name="header">Documento</f:facet>
                                            #{item.documento}
                                    </h:column>

                                    <h:column>
                                        <f:facet name="header">Nombre</f:facet>
                                            #{item.nombre}
                                    </h:column>

                                    <h:column>
                                        <f:facet name="header">Apellido</f:facet>
                                            #{item.apellido}
                                    </h:column>

                                    <h:column>
                                        <f:facet name="header">Teléfono</f:facet>
                                            #{item.telefono}
                                    </h:column>

                                    <h:column>
                                        <f:facet name="header">Email</f:facet>
                                            #{item.email}
                                    </h:column>

                                    <h:column>
                                        <f:facet name="header">Dirección</f:facet>
                                            #{item.direccion}
                                    </h:column>

                                    <h:column>
                                        <f:facet name="header">Fecha</f:facet>
                                        <h:outputText value="#{item.fechaRegistro}">
                                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                                        </h:outputText>
                                    </h:column>

                                    <!-- ACCIONES -->
                                    <h:column>
                                        <f:facet name="header">Acciones</f:facet>

                                        <h:commandLink action="#{pacienteController.prepareView}"
                                                       styleClass="btn btn-info btn-sm me-1"
                                                       value="Ver"/>

                                        <h:commandLink action="#{pacienteController.prepareEdit}"
                                                       styleClass="btn btn-warning btn-sm me-1"
                                                       value="Editar"/>

                                        <h:commandLink action="#{pacienteController.destroy}"
                                                       styleClass="btn btn-danger btn-sm"
                                                       value="Eliminar"/>
                                    </h:column>

                                </h:dataTable>

                            </div>

                        </div>

                    </h:form> 
                </div>

                <!-- VOLVER -->
                <div class="mt-3">
                    <h:link outcome="/index"
                            value="Volver al inicio"
                            styleClass="btn btn-secondary"/>
                </div>

            </div>

        </ui:define>

    </ui:composition>
</html>
